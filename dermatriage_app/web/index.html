<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced at build time by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dermatriage: rash photo triage for six classes, using a dual-branch CNN and ViT model with cross-attention.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dermatriage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dermatriage</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EEF8F6">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #EEF8F6; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 99;
      display: flex; align-items: center; justify-content: center;
      background: #EEF8F6; color: #004D40;
      font: 300 12.8px/1.1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.48px; text-transform: uppercase;
      transition: opacity .3s ease;
    }
    #boot span { border-bottom: 1px solid currentColor; padding-bottom: 6px; animation: boot-fade 1.4s ease-in-out infinite; }
    @keyframes boot-fade { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { #boot span { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status"><span>Loading Dermatriage</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
